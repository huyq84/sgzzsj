version: '3.8'

services:
  # PostgreSQL数据库
  postgres:
    image: postgres:15
    container_name: construction_db
    environment:
      POSTGRES_DB: construction_design
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - construction_network

  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: construction_redis
    ports:
      - "6379:6379"
    networks:
      - construction_network

  # MinIO对象存储
  minio:
    image: minio/minio:latest
    container_name: construction_minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - construction_network

  # FastAPI后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: construction_backend
    environment:
      - DATABASE_URL=postgresql://admin:password123@postgres:5432/construction_design
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=password123
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - minio
    volumes:
      - ./backend:/app
    networks:
      - construction_network

  # AI分析服务
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: construction_ai
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MODEL_PATH=/app/models
    ports:
      - "8001:8001"
    volumes:
      - ./ai-service:/app
      - ai_models:/app/models
    networks:
      - construction_network

  # React前端应用
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: construction_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - construction_network

  # Nginx反向代理
  nginx:
    image: nginx:alpine
    container_name: construction_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/ssl:/etc/nginx/ssl
    depends_on:
      - frontend
      - backend
    networks:
      - construction_network

volumes:
  postgres_data:
  minio_data:
  ai_models:

networks:
  construction_network:
    driver: bridge